name: BoardOil
version: "1.5.0"
slug: boardoil
description: Board Oil is a self hosted kanban style board
url: https://github.com/dozigden/boardoil
image: ghcr.io/bexelbie/ha-boardoil
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
backup: cold
ports:
  "5000/tcp": null
ports_description:
  "5000/tcp": BoardOil web interface (optional; leave disabled when using a reverse proxy)
webui: "http://[HOST]:[PORT:5000]/"
watchdog: "http://[HOST]:[PORT:5000]/api/health"
options:
  allow_insecure_cookies: false
schema:
  allow_insecure_cookies: bool
